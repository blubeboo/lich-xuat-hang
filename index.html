<script>
// ================= STATE =================
let events = [];           // dữ liệu từ Sheet
let viewYear, viewMonth;   // tháng đang xem (month 0-indexed)

const MONTH_NAMES = ["tháng 1","tháng 2","tháng 3","tháng 4","tháng 5","tháng 6","tháng 7","tháng 8","tháng 9","tháng 10","tháng 11","tháng 12"];

// ================= HELPERS =================
// Đọc ngày giờ linh hoạt: chịu được nhiều định dạng khác nhau
function parseDT(s) {
  if (!s) return null;
  s = String(s).trim();

  // 1) MM/DD/YYYY HH:mm  (định dạng gốc mong đợi)
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2], +m[4], +m[5]);

  // 2) MM/DD/YYYY (không có giờ)
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2]);

  // 3) ISO: YYYY-MM-DD[ T]HH:mm
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[T\s](\d{1,2}):(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);

  // 4) Kiểu chuỗi Date của JS: "Thu Sep 04 2025 11:00:00 GMT+0700 (...)"
  //    Tự tách thủ công để không phụ thuộc ngôn ngữ (vd "Giờ Đông Dương").
  const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  m = s.match(/\b([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m && MONTHS[m[1]] !== undefined) {
    return new Date(+m[3], MONTHS[m[1]], +m[2], +m[4], +m[5], +(m[6]||0));
  }
  // Dạng chỉ có ngày kiểu "Sep 04 2025" hoặc "Thu Sep 04 2025"
  m = s.match(/\b([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})/);
  if (m && MONTHS[m[1]] !== undefined) {
    return new Date(+m[3], MONTHS[m[1]], +m[2]);
  }

  // 5) Cuối cùng mới để JS tự phân tích (chỉ khi các cách trên thất bại)
  let d = new Date(s);
  if (!isNaN(d.getTime())) return d;

  return null;
}
function dateKey(d) {
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function timeStr(d) {
  return String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');
}
// Hiển thị ngày giờ gọn dạng MM/DD/YYYY HH:mm dù nguồn ở kiểu nào
function displayDT(d) {
  if (!d) return '';
  return String(d.getMonth()+1).padStart(2,'0')+"/"+String(d.getDate()).padStart(2,'0')+"/"+d.getFullYear()
    +" "+String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');
}
function setStatus(msg) { document.getElementById('statusBar').textContent = msg; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ================= LOAD DATA (JSONP - tránh lỗi CORS) =================
function loadData() {
  if (API_URL.startsWith("DÁN")) {
    setStatus("⚠️ Chưa cấu hình link Apps Script — đang hiển thị dữ liệu mẫu.");
    events = SAMPLE.map(e => ({...e, _dt: parseDT(e.datetime)}));
    if (viewYear === undefined) goToToday();
    render();
    return;
  }
  setStatus("Đang tải dữ liệu…");

  // Tạo callback toàn cục để Apps Script gọi lại
  const cbName = "jsonpCb_" + Date.now();
  const timeout = setTimeout(() => {
    setStatus("✗ Quá thời gian chờ. Kiểm tra lại quyền truy cập của Apps Script (Anyone).");
    cleanup();
  }, 20000);

  function cleanup() {
    delete window[cbName];
    if (script && script.parentNode) script.parentNode.removeChild(script);
  }

  window[cbName] = function(data) {
    clearTimeout(timeout);
    try {
      events = (data.events || []).map(e => ({...e, _dt: parseDT(e.datetime)}));
      setStatus(`✓ Đã tải ${events.length} đơn hàng`);
      if (viewYear === undefined) goToToday();
      render();
    } catch (err) {
      setStatus("✗ Lỗi xử lý dữ liệu.");
      console.error(err);
    }
    cleanup();
  };

  const script = document.createElement('script');
  script.src = API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + "callback=" + cbName + "&t=" + Date.now();
  script.onerror = () => {
    clearTimeout(timeout);
    setStatus("✗ Không tải được dữ liệu. Kiểm tra lại link Apps Script.");
    cleanup();
  };
  document.body.appendChild(script);
}

function goToToday() {
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth();
}

// ================= TOGGLE DONE =================
async function toggleDone(ev) {
  const newVal = !ev.done;
  ev.done = newVal;              // cập nhật ngay trên màn hình
  render();
  if (API_URL.startsWith("DÁN")) return; // chế độ demo, không ghi
  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "toggle", code: ev.code, datetime: ev.datetime, done: newVal })
    });
    setStatus("✓ Đã lưu vào Google Sheet");
  } catch (err) {
    setStatus("✗ Lưu thất bại, thử lại.");
    ev.done = !newVal; render();
  }
}

// ================= LƯU GHI CHÚ =================
async function saveNote(ev, newNote) {
  const old = ev.note || '';
  if (newNote === old) return;
  ev.note = newNote;
  if (API_URL.startsWith("DÁN")) { render(); return; }
  setStatus("Đang lưu ghi chú…");
  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "note", code: ev.code, datetime: ev.datetime, note: newNote })
    });
    setStatus("✓ Đã lưu ghi chú vào Google Sheet");
  } catch (err) {
    setStatus("✗ Lưu ghi chú thất bại.");
    ev.note = old;
  }
  render();
}

// ================= RENDER =================
function isOverdue(ev) {
  // Quá hạn = có ngày, ngày giờ giao đã qua thời điểm hiện tại, và chưa giao
  return ev._dt && !ev.done && ev._dt.getTime() < Date.now();
}

function eventCard(ev) {
  const overdue = isOverdue(ev);
  // "Chờ xuất": ghi chú chứa chữ "chờ xuất" và chưa tích giao
  const waiting = !ev.done && (ev.note || '').toLowerCase().includes('chờ xuất');

  // Màu nền cả thẻ theo trạng thái (ưu tiên: đã giao > chờ xuất > quá hạn)
  let cardBg = "bg-white border-[#ededec]";
  if (ev.done) cardBg = "bg-[#EEF3DC] border-[#D3E2A6] border-l-4 border-l-[#B0C965]";        // Green Glow: đã giao
  else if (waiting) cardBg = "bg-[#E8EEF6] border-[#C9D6E8] border-l-4 border-l-[#9EB4D3]";  // Chambray Blue: chờ xuất
  else if (overdue) cardBg = "bg-[#F1E3E6] border-[#DCC0C7] border-l-4 border-l-[#64313E]";  // Burgundy: quá hạn

  const checkbox = ev.done
    ? `<span class="inline-flex items-center justify-center w-[15px] h-[15px] rounded-[3px] bg-[#B0C965] text-[#2F3A0C] text-[10px] font-bold leading-none shrink-0">✓</span>`
    : `<span class="inline-flex items-center justify-center w-[15px] h-[15px] rounded-[3px] border-2 ${waiting ? 'border-[#9EB4D3]' : (overdue ? 'border-[#64313E]' : 'border-[#c7c7c5]')} shrink-0"></span>`;

  const statusText = ev.done ? 'Đã giao' : (waiting ? 'Chờ xuất' : (overdue ? 'Quá hạn' : (ev.status || 'Giao hàng')));
  const statusColor = ev.done ? 'text-[#4F6A16] font-medium' : (waiting ? 'text-[#2E4466] font-medium' : (overdue ? 'text-[#64313E] font-medium' : 'text-[#37352f]'));

  const noteText = ev.note || '';
  const noteClass = noteText ? 'text-[#787774]' : 'text-[#c7c7c5] italic';
  const noteDisplay = noteText || '+ Thêm ghi chú';

  const card = document.createElement('div');
  card.className = `border rounded-md px-2 py-1.5 mb-1.5 shadow-[0_1px_2px_rgba(0,0,0,0.04)] hover:shadow-[0_1px_4px_rgba(0,0,0,0.10)] transition-shadow ${cardBg}`;
  card.innerHTML = `
    <div class="flex items-start justify-between gap-1">
      <span class="font-bold text-[13px] break-words leading-snug">${escapeHtml(ev.code)}</span>
      <span class="text-[11px] text-[#9b9a97] shrink-0">${ev._dt ? timeStr(ev._dt) : ''}</span>
    </div>
    <div class="text-[11px] text-[#787774] mt-1">${ev._dt ? displayDT(ev._dt) : escapeHtml(ev.datetime)}</div>
    <div class="flex items-center gap-1 mt-1 text-[11px] cursor-pointer select-none toggle ${statusColor}">${checkbox}<span>${statusText}</span></div>
    <div class="note-box text-[11px] ${noteClass} mt-1 leading-snug cursor-text hover:bg-black/5 rounded px-0.5 -mx-0.5" title="Bấm để sửa ghi chú">${escapeHtml(noteDisplay)}</div>
  `;
  card.querySelector('.toggle').addEventListener('click', () => toggleDone(ev));

  // Bấm vào ghi chú -> biến thành ô nhập
  const noteBox = card.querySelector('.note-box');
  noteBox.addEventListener('click', () => {
    const ta = document.createElement('textarea');
    ta.value = ev.note || '';
    ta.rows = 2;
    ta.className = "w-full text-[11px] text-[#37352f] mt-1 border border-[#2383e2] rounded px-1 py-0.5 outline-none resize-none";
    ta.placeholder = "Nhập ghi chú…";
    noteBox.replaceWith(ta);
    ta.focus();
    const commit = () => saveNote(ev, ta.value.trim());
    ta.addEventListener('blur', commit);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
      if (e.key === 'Escape') { ta.value = ev.note || ''; ta.blur(); }
    });
  });

  return card;
}

function render() {
  document.getElementById('monthLabel').textContent = MONTH_NAMES[viewMonth] + " năm " + viewYear;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Đếm đơn quá hạn (chưa giao, đã qua ngày) trong tháng đang xem — TÍNH cả đơn chờ xuất
  const overdueList = events.filter(ev =>
    isOverdue(ev)
    && ev._dt.getFullYear() === viewYear && ev._dt.getMonth() === viewMonth
  );
  const badge = document.getElementById('overdueBadge');
  if (overdueList.length > 0) {
    badge.textContent = "⚠ " + overdueList.length + " đơn quá hạn chưa giao";
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }

  const firstDay = new Date(viewYear, viewMonth, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // Mon=0
  const gridStart = new Date(viewYear, viewMonth, 1 - startOffset);

  // gom đơn theo ngày
  const byDay = {};
  events.forEach(ev => {
    if (!ev._dt) return;
    const k = dateKey(ev._dt);
    (byDay[k] = byDay[k] || []).push(ev);
  });
  Object.values(byDay).forEach(list => list.sort((a,b)=>a._dt-b._dt));

  const todayKey = dateKey(new Date());

  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const key = dateKey(d);
    const inMonth = d.getMonth() === viewMonth;
    const dayEvents = byDay[key] || [];

    const cell = document.createElement('div');
    cell.className = "border-r border-b border-[#ededec] min-h-[150px] p-2 " + (inMonth ? "bg-white" : "bg-[#fbfbfa]");

    const head = document.createElement('div');
    head.className = "flex items-center justify-end mb-1.5";
    const isToday = key === todayKey;
    head.innerHTML = `<span class="text-[12px] ${isToday ? 'bg-[#2383e2] text-white rounded-full w-5 h-5 flex items-center justify-center' : (inMonth ? 'text-[#37352f]' : 'text-[#c7c7c5]')}">${d.getDate()}</span>`;
    cell.appendChild(head);

    const list = document.createElement('div');
    list.className = "cal-scroll";
    dayEvents.forEach(ev => list.appendChild(eventCard(ev)));
    cell.appendChild(list);

    grid.appendChild(cell);
  }
}

// ================= CONTROLS =================
document.getElementById('prevBtn').onclick = () => { viewMonth--; if (viewMonth<0){viewMonth=11;viewYear--;} render(); };
document.getElementById('nextBtn').onclick = () => { viewMonth++; if (viewMonth>11){viewMonth=0;viewYear++;} render(); };
document.getElementById('todayBtn').onclick = () => { goToToday(); render(); };
document.getElementById('refreshBtn').onclick = () => loadData();

// ================= DỮ LIỆU MẪU (chỉ hiện khi chưa gắn link) =================
const SAMPLE = [
  {code:"SPI 2664", datetime:"06/29/2026 13:00", status:"Giao hàng", note:"", done:false},
  {code:"ND 2664", datetime:"06/29/2026 14:00", status:"Giao hàng", note:"", done:false},
  {code:"LA 2656", datetime:"06/29/2026 14:00", status:"Giao hàng", note:"1 phần giao tháng 6, 1 phần giao th...", done:false},
  {code:"VTM 2698", datetime:"06/29/2026 15:00", status:"Giao hàng", note:"", done:true},
  {code:"HV 2629", datetime:"06/30/2026 15:00", status:"Giao hàng", note:"", done:false},
  {code:"HV KM 2606-01", datetime:"06/30/2026 16:00", status:"Giao hàng", note:"", done:true},
  {code:"ICARE KM 2606-01", datetime:"07/01/2026 15:00", status:"Giao hàng", note:"", done:false},
  {code:"VTM 2699", datetime:"07/02/2026 15:00", status:"Giao hàng", note:"", done:false},
  {code:"ND 2665", datetime:"07/03/2026 13:00", status:"Giao hàng", note:"", done:true},
];

// ================= GANTT =================
let ganttOrders = [];
let ganttLoaded = false;

function loadGantt() {
  const body = document.getElementById('ganttBody');
  if (GANTT_API_URL.startsWith("DÁN")) {
    body.innerHTML = '<div class="text-[13px] text-[#9b9a97] py-6 text-center">⚠️ Chưa cấu hình link Gantt. Dán link Apps Script của file Order Processing Tracking vào biến GANTT_API_URL.</div>';
    return;
  }
  body.innerHTML = '<div class="text-[13px] text-[#9b9a97] py-6 text-center">Đang tải tiến trình…</div>';

  const cbName = "ganttCb_" + Date.now();
  const timeout = setTimeout(() => {
    body.innerHTML = '<div class="text-[13px] text-[#e03e3e] py-6 text-center">✗ Quá thời gian chờ. Kiểm tra link Gantt (quyền Anyone).</div>';
    cleanup();
  }, 60000);
  function cleanup(){ delete window[cbName]; if (s && s.parentNode) s.parentNode.removeChild(s); }

  window[cbName] = function(data){
    clearTimeout(timeout);
    ganttOrders = data.orders || [];
    ganttLoaded = true;
    renderGantt();
    cleanup();
  };
  const s = document.createElement('script');
  s.src = GANTT_API_URL + (GANTT_API_URL.indexOf('?')>=0?'&':'?') + "callback=" + cbName + "&t=" + Date.now();
  s.onerror = () => { clearTimeout(timeout); body.innerHTML = '<div class="text-[13px] text-[#e03e3e] py-6 text-center">✗ Không tải được dữ liệu Gantt.</div>'; cleanup(); };
  document.body.appendChild(s);
}

function renderGantt() {
  const body = document.getElementById('ganttBody');
  if (!ganttOrders.length) {
    body.innerHTML = '<div class="text-[16px] text-[#9b9a97] py-10 text-center">✓ Không có đơn nào đang dở — tất cả đã hoàn thành.</div>';
    return;
  }

  // Màu Pantone: solid = đã xong, tint = còn giờ cần làm
  const C = {
    'Lấy':  { solid:'#B0C965', tint:'#EEF3DC', text:'#3E4A14', onSolid:'#2F3A0C' }, // Green Glow 13-0442 TCX
    'Dán':  { solid:'#64313E', tint:'#F1E3E6', text:'#64313E', onSolid:'#FFFFFF' }, // Burgundy
    'Kiểm': { solid:'#9EB4D3', tint:'#E8EEF6', text:'#2E4466', onSolid:'#1E3150' }  // Chambray Blue 15-4030 TCX
  };

  let html = '';
  ganttOrders.forEach(o => {
    const sumRem = o.stages.reduce((a,s)=>a + (s.remaining||0), 0);

    const segs = o.stages.map(s => {
      const c = C[s.label] || { solid:'#999', tint:'#eee', text:'#333', onSolid:'#fff' };
      const rem = s.remaining || 0;
      const isDone = s.has && s.done;
      const w = sumRem > 0 ? Math.max(rem / sumRem * 100, rem > 0 ? 12 : 9) : (100 / 3);
      const bg = isDone ? c.solid : (s.has ? c.tint : '#F4F4F2');
      const fg = isDone ? c.onSolid : (s.has ? c.text : '#b4b2a9');
      const label = isDone ? `${s.label} ✓` : (s.has ? `${s.label} · ${rem}h` : `${s.label} —`);
      return `<div class="h-full flex items-center justify-center text-[14px] font-semibold whitespace-nowrap overflow-hidden px-2" style="width:${w}%;background:${bg};color:${fg}" title="${s.label}: ${isDone ? 'đã xong' : 'còn ' + rem + ' giờ'}">${label}</div>`;
    }).join('<div style="width:2px;background:#fff;flex-shrink:0"></div>');

    const pills = o.stages.map(s => {
      const c = C[s.label];
      const val = !s.has ? '<span class="text-[#b4b2a9]">—</span>'
        : (s.done ? '<span class="font-semibold" style="color:#5a7a1e">Đã xong</span>'
                  : `còn <span class="font-semibold" style="color:${c.text}">${s.remaining||0} giờ</span>`);
      return `<span class="inline-flex items-center gap-2"><span class="w-3 h-3 rounded-full inline-block" style="background:${c.solid}"></span>${s.label}: ${val}</span>`;
    }).join('');

    const pctColor = o.statusPct >= 70 ? '#5a7a1e' : (o.statusPct >= 30 ? '#2E4466' : '#64313E');

    html += `
    <div class="g-card mb-4 bg-white border border-[#e9e9e7] rounded-xl px-5 py-4">
      <div class="flex items-start justify-between gap-3 flex-wrap mb-3">
        <div class="min-w-0">
          <div class="text-[20px] font-bold text-[#2b2a26] leading-tight">${esc(o.code)}</div>
          <div class="flex items-center gap-2 mt-1 flex-wrap text-[14px] text-[#787774]">
            <span>🚚 Giao: <span class="text-[#37352f] font-medium">${esc(o.datetime)}</span></span>
            ${o.ptype ? `<span class="px-2 py-0.5 rounded-md bg-[#f4f4f2] text-[13px]">${esc(o.ptype)}</span>` : ''}
          </div>
        </div>
        <div class="text-right">
          <div class="text-[22px] font-bold leading-none" style="color:${pctColor}">${o.statusPct}%</div>
          <div class="text-[13px] text-[#787774] mt-1">hoàn thành · còn <span class="font-semibold text-[#37352f]">${o.totalRemaining} giờ</span></div>
        </div>
      </div>
      <div class="flex w-full h-11 rounded-lg overflow-hidden">${segs}</div>
      <div class="flex gap-x-6 gap-y-1 mt-3 text-[15px] text-[#5f5e5a] flex-wrap">${pills}</div>
    </div>`;
  });
  body.innerHTML = html;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ================= CHUYỂN TAB =================
function showTab(which) {
  const isLich = which === 'lich';
  document.getElementById('viewLich').classList.toggle('hidden', !isLich);
  document.getElementById('viewGantt').classList.toggle('hidden', isLich);
  const tL = document.getElementById('tabLich'), tG = document.getElementById('tabGantt');
  tL.className = isLich
    ? "px-3 py-1.5 rounded-md text-[16px] font-medium text-[#37352f] border-b-2 border-[#37352f]"
    : "px-3 py-1.5 rounded-md text-[16px] text-[#9b9a97] hover:bg-[#f5f5f4]";
  tG.className = !isLich
    ? "px-3 py-1.5 rounded-md text-[16px] font-medium text-[#37352f] border-b-2 border-[#37352f]"
    : "px-3 py-1.5 rounded-md text-[16px] text-[#9b9a97] hover:bg-[#f5f5f4]";
  if (!isLich && !ganttLoaded) loadGantt();
}
document.getElementById('tabLich').onclick = () => showTab('lich');
document.getElementById('tabGantt').onclick = () => showTab('gantt');

// Nút Làm mới: làm mới đúng chế độ đang xem
const _origRefresh = document.getElementById('refreshBtn').onclick;
document.getElementById('refreshBtn').onclick = () => {
  if (document.getElementById('viewGantt').classList.contains('hidden')) {
    loadData();
  } else {
    ganttLoaded = false; loadGantt();
  }
};

// khởi động
loadData();
